name: Arrived
description: >-
  Arrived is a real estate investment platform that lets individuals buy, own, and sell fractional
  shares of income-producing residential properties without the work of being a landlord. Investors
  browse curated single-family rentals, vacation rentals, funds, and real-estate debt offerings,
  invest in minutes, and receive passive rental income through dividend distributions plus potential
  appreciation while Arrived handles acquisition and property management. The company reports roughly
  981K registered investors, $445M invested, and $95M distributed. Arrived is a consumer-facing
  investing product with a web and mobile app; it does not publish a public developer API, SDK, or
  developer portal, so this profile captures its public identity and domain-security posture.
